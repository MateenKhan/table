      <div style="max-width: 720px; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.6;">
        <h1>Jugaaadi Table — Open Source React Spreadsheet Component</h1>
        <p>A world-class, spreadsheet-style data table for React built on TanStack Table v8.</p>
        <h2>Features</h2>
        <ul>
          <li>Editable cells with 15+ column types (text, number, date, select, checkbox, rating, currency, and more)</li>
          <li>Formula engine with cross-sheet references using @</li>
          <li>Cell merging (colspan &amp; rowspan)</li>
          <li>Rich formatting — background/text colors, borders, fonts, bold/italic/underline</li>
          <li>Find &amp; replace across sheets</li>
          <li>CSV export and import</li>
          <li>Undo/redo with full history</li>
          <li>Column pinning, sorting, grouping, and resizing</li>
          <li>Row freezing and pagination</li>
          <li>Blank-sheet mode — build your own spreadsheet from scratch</li>
        </ul>
        <h2>Install</h2>
        <pre><code>npm install @jugaaadi/table</code></pre>
