name: Deploy docs site

# Builds on GitHub's runners and ships only the static output to the VPS.
# No container, no build tooling on the server — nginx just serves a folder.
#
# The Vite app (landing page + interactive demo) serves as the root.
# Docusaurus docs are nested under /docs/.

on:
  push:
    branches: [main]
    # The demo is the app, so a change to src/ has to redeploy too.
    paths:
      - 'website/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch: # lets you redeploy by hand from the Actions tab

concurrency:
  # A newer push supersedes an in-flight deploy rather than racing it.
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ── the live demo: the application itself ──────────────────────────────
      #
      # The lockfile is dropped before installing, which is what rollup's own
      # error message tells you to do.
      #
      # Both lockfiles here were authored on Windows, and npm materialises only
      # the host platform's optional dependencies as package entries
      # (npm/cli#4828) — @rollup/rollup-linux-x64-gnu is recorded as a
      # declaration but never as an installed entry. `npm ci` and plain
      # `npm install` both honour that and the Linux build dies on "Cannot find
      # module". Regenerating the lockfile inside a Linux container does not fix
      # it either; npm still only writes the platform it ran on.
      #
      # The trade-off is real: CI resolves fresh instead of installing a pinned
      # tree. Acceptable for a static docs deploy — nothing here is published to
      # a registry — but it is why a build can drift without a commit.
      - name: Install app dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build the landing page + demo app
        run: npm run build

      # ── the docs site ─────────────────────────────────────────────────────
      # Same platform-optional-dependency caveat as the app install above.
      - name: Install docs dependencies
        working-directory: website
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build docs site
        working-directory: website
        run: npm run build

      - name: Assemble site (landing at /, docs at /docs/)
        run: |
          # The Vite app (landing page + interactive demo) is the root.
          # Docusaurus docs are nested under /docs/.
          mkdir -p dist/docs
          cp -r website/build/. dist/docs/

          if [ ! -f dist/index.html ]; then
            echo "::error::Landing page build is missing — dist/index.html was not produced."
            exit 1
          fi
          if [ ! -f dist/docs/index.html ]; then
            echo "::error::Docs build is missing — dist/docs/index.html was not produced."
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh

          # Secrets pasted through a browser routinely pick up a trailing
          # newline or space. ssh then dies with "hostname contains invalid
          # characters", which points nowhere near the real cause.
          HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          USER_="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          PORT="$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')"
          {
            echo "SSH_HOST_CLEAN=$HOST"
            echo "SSH_USER_CLEAN=$USER_"
            echo "SSH_PORT_CLEAN=$PORT"
          } >> "$GITHUB_ENV"

          # The secret can be stored as either:
          #   (a) raw PEM/OPENSSH text   — works if GitHub preserved newlines
          #   (b) base64-encoded blob    — immune to newline mangling
          # Detect which one we got and normalise to a file ssh can read.
          if printf '%s' "$SSH_PRIVATE_KEY" | head -1 | grep -q "^-----BEGIN"; then
            printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            printf '%s' "$SSH_PRIVATE_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          # Debug: key format and line count (never prints the key itself).
          echo "Key lines: $(wc -l < ~/.ssh/deploy_key)"
          head -1 ~/.ssh/deploy_key
          tail -1 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key || echo "::warning::ssh-keygen could not parse the deploy key"

          # Is the port even reachable? Distinguishes the two failures that
          # look identical from the keyscan alone: a refused connection comes
          # back instantly (sshd down, wrong port), whereas a silent drop
          # burns the full timeout (firewall DROP, provider-level block).
          echo "Probing $HOST:$PORT from $(curl -sS --max-time 10 https://api.ipify.org || echo 'unknown runner IP')"
          probe_start=$(date +%s)
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$HOST/$PORT" 2>/dev/null; then
            echo "TCP connect succeeded in $(( $(date +%s) - probe_start ))s"
          else
            echo "::warning::TCP connect to $HOST:$PORT failed after $(( $(date +%s) - probe_start ))s"
          fi

          # Pin the host key so a hijacked DNS record can't collect the deploy
          # key. stderr is kept — hiding it turns every cause into the same
          # unhelpful "could not reach".
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts || true

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Could not reach $HOST:$PORT. An instant failure means refused (sshd down or wrong port); a ~5s one means packets dropped (firewall or provider block). The runner IP is printed above — it is what needs allowing."
            exit 1
          fi

      - name: Deploy to VPS
        env:
          # nginx derives the web root from the hostname, so the folder is
          # named after the domain and no server config changes per site.
          SITE_DOMAIN: table.jugaaadi.com
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT_CLEAN"
          TARGET="$SSH_USER_CLEAN@$SSH_HOST_CLEAN"
          WEB_ROOT="/var/www/sites/$SITE_DOMAIN"

          # First deploy of a new site creates its folder; rsync won't.
          $SSH "$TARGET" "mkdir -p '$WEB_ROOT'"

          # Trailing slash on the source is required, or rsync nests a
          # build/ directory inside the web root.
          rsync -az --delete -e "$SSH" dist/ "$TARGET:$WEB_ROOT/"

      - name: Summary
        run: |
          {
            echo "Deployed to https://table.jugaaadi.com"
            echo ""
            echo "- Landing + demo: https://table.jugaaadi.com/"
            echo "- Docs: https://table.jugaaadi.com/docs/intro"
          } >> "$GITHUB_STEP_SUMMARY"
